<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23B45309%22 stroke-width=%222%22%3E%3Cpath d=%22M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: setup wizard -> board (runs sidebar | section tabs | cards) -> receipt drawer; guided tour on top. 8px spacing scale. */
:root{
  --bg:#F6F5F1; --side:#EEECE5; --card:#FFFFFF; --slip:#FFFDF6;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --line:#E5E2D9;
  --accent:#B45309; --accent-soft:#FDF2DE; --blue:#1D4ED8; --blue-soft:#EAF0FF; --ok:#15803D; --ok-soft:#E3F6E8;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r1:8px; --r2:12px; --r3:16px;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 18px rgba(17,24,39,.06);
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:var(--r1)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:44px;padding:0 var(--s5);border-radius:var(--r2);font-weight:600;font-size:15px;transition:background .15s,border-color .15s,color .15s}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
.btn.ghost:hover{border-color:#CFCBC0;color:var(--ink)}
.btn.link{height:auto;padding:0;color:var(--muted);font-weight:500;font-size:14px}
.btn.link:hover{color:var(--ink)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:var(--s6) var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s6);position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s2)}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.brand span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.group{display:grid;gap:var(--s1)}
.label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 var(--s2) var(--s2)}
.run{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);text-align:left;padding:var(--s3);border-radius:var(--r2);transition:background .15s}
.run:hover{background:rgba(255,255,255,.55)}
.run[aria-selected="true"]{background:var(--card);box-shadow:var(--shadow)}
.run .d{font-weight:700;font-size:15px;line-height:1.3}
.run .s{font-size:12.5px;color:var(--muted)}
.run .n{font:600 12px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.side .tools{display:grid;gap:var(--s1);margin-top:auto}
.side .tools .btn.link{justify-content:flex-start;padding:var(--s2);gap:var(--s2)}
.side .fine{font-size:12px;color:var(--muted);line-height:1.5;padding:var(--s3) var(--s2) 0;border-top:1px solid var(--line)}

main{min-width:0;padding:var(--s6) clamp(16px,3.5vw,var(--s7)) var(--s7)}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:var(--s5)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:var(--s4)}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--muted)}
h1{font-size:clamp(26px,3vw,32px);font-weight:800;letter-spacing:-.025em;line-height:1.2;margin-top:var(--s1)}
.count{display:flex;align-items:center;gap:var(--s3);background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:var(--s3) var(--s4);box-shadow:var(--shadow)}
.count .n{font:600 34px/1 var(--mono);color:var(--accent)}
.count .t{font-size:13.5px;color:var(--muted);line-height:1.35}
.count .t b{display:block;color:var(--ink);font-weight:700}
.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);color:var(--muted);font-weight:600;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .c{font:600 11.5px var(--mono);background:var(--side);color:var(--muted);border-radius:999px;padding:1px 7px}
.tab[aria-selected="true"] .c{background:var(--ink);color:#fff}
.panelwrap{display:grid;gap:var(--s4)}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
@media (max-width:1060px){.cards{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.rank{font:600 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.when{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.card h3{font-size:18px;font-weight:700;line-height:1.35;letter-spacing:-.015em;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--side);border-radius:999px;padding:4px 10px}
.chip.talk{background:var(--blue-soft);color:var(--blue)}
.reason{font-size:15px;color:var(--ink-2);line-height:1.6}
.note{display:flex;gap:var(--s2);font-size:14px;color:var(--ink-2);background:var(--bg);border-radius:var(--r1);padding:var(--s2) var(--s3);line-height:1.5}
.note svg{margin-top:3px;color:var(--muted)}
.foot{margin-top:auto;padding-top:var(--s3);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:help}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.rbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--blue);padding:6px 10px;border-radius:var(--r1);border:1px solid var(--line);background:var(--card);transition:border-color .15s,background .15s}
.rbtn:hover{border-color:var(--blue);background:var(--blue-soft)}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r3);padding:var(--s6);text-align:center}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow);padding:var(--s5);display:grid;gap:var(--s4);align-content:start;min-width:0}
.panel h3{font-size:16px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--s4)}
.list{display:grid}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);padding:var(--s3) 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item .t{font-weight:600;font-size:15px}
.item .m{font-size:14px;color:var(--muted);margin-top:2px}
.rows{display:grid;gap:var(--s3)}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow);padding:var(--s4) var(--s5);display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--s4);align-items:center}
.row .t{font-weight:700}
.row .m{font-size:13.5px;color:var(--muted)}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.prog{background:var(--blue-soft);color:var(--blue)}
.vs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.box{background:var(--bg);border-radius:var(--r2);padding:var(--s3) var(--s4);display:grid;gap:var(--s2);align-content:start}
.box .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.box .v{font-weight:700}
.box.verdict{background:var(--ink);color:#fff}
.box.verdict .k{color:#9CA3AF}
.box.verdict .w{font-size:14px;color:#E5E7EB}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 24px;gap:var(--s3);align-items:center;font-size:14.5px;font-weight:600}
.bar .track{height:8px;background:var(--side);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--ink);border-radius:999px}
.bar .n{font-family:var(--mono);text-align:right}
.caution{font-size:13.5px;color:var(--muted);background:var(--bg);border-radius:var(--r1);padding:var(--s2) var(--s3)}
.muted{color:var(--muted)}

/* ---------- receipt drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.32);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:30;padding:var(--s5);overflow-y:auto}
.slip{background:var(--slip);font-family:var(--mono);font-size:13px;color:var(--ink);padding:var(--s5) var(--s5) 40px;box-shadow:0 12px 32px rgba(17,24,39,.25);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.slip .top{display:flex;justify-content:space-between;align-items:center}
.slip .top b{letter-spacing:.3em;font-size:13px}
.slip .x{display:inline-flex;padding:6px;border-radius:var(--r1)}
.slip .x:hover{background:var(--side)}
.slip hr{border:0;border-top:1.5px dashed #D3CDBC;margin:var(--s4) 0}
.slip .title{font-family:var(--sans);font-size:17px;font-weight:700;line-height:1.35}
.slip .src{display:grid;gap:6px;margin-bottom:var(--s4)}
.slip .lbl{font-weight:600}
.slip .loc{color:var(--muted);font-size:11.5px;word-break:break-word}
.slip q{font-family:var(--sans);font-style:italic;font-size:15px;line-height:1.5}
.slip .priv{font-family:var(--sans);font-size:13.5px;color:var(--ink-2);background:var(--side);border-radius:6px;padding:6px 10px}
.slip .tot{display:flex;justify-content:space-between;font-weight:600}
.slip .fine{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:var(--s3);text-align:center}

/* ---------- setup wizard ---------- */
.onb{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:grid;place-items:center;padding:var(--s5) 16px}
.ob{width:min(620px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(17,24,39,.10);padding:var(--s6);display:grid;gap:var(--s5)}
.ob .bar1{display:flex;justify-content:space-between;align-items:center}
.stepper{display:flex;align-items:center}
.st{display:flex;align-items:center;gap:var(--s2);flex:none}
.st .o{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);border:1.5px solid var(--line);color:var(--muted);background:var(--card);transition:all .2s}
.st .o svg{width:14px;height:14px}
.st span{font-size:13px;font-weight:600;color:var(--muted)}
.st.active .o{background:var(--ink);border-color:var(--ink);color:#fff}
.st.active span{color:var(--ink)}
.st.done .o{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.st.done span{color:var(--ink-2)}
.line{flex:1;height:1.5px;background:var(--line);margin:0 var(--s3);min-width:16px}
.ob h2{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.ob .lead{color:var(--ink-2);margin-top:var(--s2)}
.field{display:grid;gap:var(--s2)}
.field label{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.field input{height:48px;border:1.5px solid var(--line);border-radius:var(--r2);padding:0 var(--s4);font-size:16px;background:var(--card)}
.field input:focus{outline:none;border-color:var(--ink)}
.hint{font-size:13.5px;color:var(--muted)}
.choices{display:grid;gap:var(--s3)}
.choice{display:flex;align-items:center;gap:var(--s4);text-align:left;border:1.5px solid var(--line);border-radius:var(--r2);padding:var(--s4);transition:border-color .15s,background .15s}
.choice:hover{border-color:#CFCBC0}
.choice[aria-checked="true"]{border-color:var(--ink);background:var(--bg)}
.choice .cal{width:52px;flex:none;border-radius:10px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--card)}
.choice .cal i{display:block;font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:#fff;padding:2px 0;font-style:normal}
.choice .cal b{display:block;font:600 20px/1.5 var(--mono)}
.choice .t{font-weight:700}
.choice .m{font-size:13.5px;color:var(--muted)}
.drop{border:1.5px dashed #CFCBC0;border-radius:var(--r2);padding:var(--s4);display:flex;align-items:center;gap:var(--s3);color:var(--ink-2);background:var(--bg)}
.drop svg{width:22px;height:22px;color:var(--muted)}
.drop{cursor:pointer;transition:border-color .15s,background .15s}.drop:hover{border-color:var(--ink-2);background:var(--card)}
.files{display:grid;max-height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r2)}
.file{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:10px var(--s4);border-top:1px solid var(--line);font-size:14px}
.file:first-child{border-top:0}
.kind{font-size:11.5px;font-weight:700;text-align:center;border-radius:6px;padding:2px 0;background:var(--side);color:var(--ink-2)}
.kind.brief{background:var(--accent-soft);color:var(--accent)}
.kind.notes{background:var(--blue-soft);color:var(--blue)}
.kind.tracker{background:var(--ok-soft);color:var(--ok)}
.file .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.file .mt{font-size:12.5px;color:var(--muted);white-space:nowrap}
.rules{display:grid;gap:var(--s3)}
.rule{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r2);background:var(--bg)}
.rule .ck{width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.rule .ck svg{width:13px;height:13px}
.rule b{display:block;font-size:15px}
.rule span{font-size:13.5px;color:var(--muted)}
.build{display:grid;gap:var(--s3)}
.stage{display:flex;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r2);transition:background .2s}
.stage .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line)}
.stage.running .ic{border-color:var(--ink);border-right-color:transparent;animation:spin .8s linear infinite}
.stage.ok{background:var(--bg)}
.stage.ok .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.stage.ok .ic svg{width:13px;height:13px}
.stage b{display:block;font-size:15px}
.stage span{font-size:13.5px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.actions{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.actions .right{display:flex;gap:var(--s3);margin-left:auto}

/* ---------- guided tour ---------- */
.tour{position:fixed;inset:0;z-index:45;pointer-events:none}
.spot{position:fixed;border-radius:var(--r3);box-shadow:0 0 0 9999px rgba(17,24,39,.55);transition:all .3s ease;pointer-events:none}
.coach{position:fixed;width:min(360px,calc(100vw - 32px));background:var(--card);border-radius:var(--r3);box-shadow:0 18px 40px rgba(17,24,39,.3);padding:var(--s5);display:grid;gap:var(--s3);pointer-events:auto;transition:top .3s ease,left .3s ease}
.coach .k{font:600 12px var(--mono);color:var(--accent)}
.coach h4{margin:0;font-size:18px;font-weight:800;letter-spacing:-.015em;line-height:1.3}
.coach p{font-size:14.5px;color:var(--ink-2)}
.coach .why{font-size:13.5px;color:var(--muted);border-left:3px solid var(--accent-soft);padding-left:var(--s3)}
.coach .actions .btn{height:38px;padding:0 var(--s4);font-size:14px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;gap:var(--s4);padding:var(--s3) 16px}
  .group,.nav{grid-auto-flow:column}.label,.side .tools,.side .fine,.brand span,.tagline{display:none}.nav button{white-space:nowrap}
  .vs{grid-template-columns:1fr}.row{grid-template-columns:1fr}
  .st span{display:none}
}

/* merged nav (Ethan's Figma app): section sidebar, breadcrumb + date dropdown, hero, milestone, new sections */
.wordmark{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1}
.wordmark i{font-style:normal;color:var(--accent)}
.tagline{font-size:13px;color:var(--muted);line-height:1.45;padding:0 var(--s2)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:44px;padding:0 var(--s3);border-radius:var(--r2);font-weight:600;font-size:15px;color:var(--ink-2);text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.nav .c{font:600 11.5px var(--mono);color:var(--muted)}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);flex-wrap:wrap;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:var(--s3)}
.crumb b{color:var(--ink);font-weight:600}
.datesel{display:inline-flex;align-items:center;gap:var(--s2);background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:0 var(--s2) 0 var(--s3);height:44px;box-shadow:var(--shadow);color:var(--ink-2)}
.datesel select{border:0;background:none;font:600 15px var(--sans);color:var(--ink);cursor:pointer;height:42px;padding-right:var(--s1)}
.hero .sub{color:var(--muted);margin-top:var(--s1);max-width:62ch}
.mile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2) var(--s4);align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow);padding:var(--s4) var(--s5)}
.mile .n{font:600 36px/1 var(--mono);color:var(--accent);grid-row:span 2;text-align:center}
.mile .n small{display:block;font:600 11px var(--sans);color:var(--muted);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.mile .t{font-weight:700;display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.mile .t span{color:var(--muted);font-weight:500;font-size:14px}
.mile .track{height:8px;background:var(--side);border-radius:999px;overflow:hidden}
.mile .fill{height:100%;background:var(--accent);border-radius:999px}
.rbtn{white-space:nowrap;flex:none}
.pill.unk{background:var(--side);color:var(--ink-2)}
.av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 14px var(--sans);flex:none}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s4)}
.person .who{display:flex;align-items:center;gap:var(--s3);font-size:16px}
.person .nums{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.person .nums b{display:block;font:600 24px/1.1 var(--mono)}
.person .nums span{font-size:13px;color:var(--muted);line-height:1.3}
.toolrow{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;height:44px;border:1px solid var(--line);border-radius:var(--r2);padding:0 var(--s4);background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card)}
.seg button{padding:0 var(--s4);height:42px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tablewrap{overflow-x:auto;padding:var(--s2) var(--s4)}
table.rec{width:100%;border-collapse:collapse;font-size:14.5px}
.rec th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:var(--s3);border-bottom:1px solid var(--line);white-space:nowrap}
.rec td{padding:var(--s3);border-bottom:1px solid var(--line);vertical-align:middle}
.rec tr:last-child td{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s4)}
.stat b{font:600 30px/1.1 var(--mono)}
.stat span{color:var(--muted);font-size:14px}
.srcfile .m{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.srcfile .kind{padding:2px 8px}
.coachgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--s4);align-items:start}
.agenda h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 var(--s2)}
.agenda ol,.agenda ul{margin:0;padding-left:20px;display:grid;gap:var(--s2)}
@media (max-width:900px){.coachgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Navigation">
    <div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg></span>
      <div class="wordmark">receipts<i>.</i></div></div>
    <p class="tagline">Every warning has a reason. Every reason has a receipt.</p>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="tools">
      <button class="btn link" id="replay-setup"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Replay setup</button>
      <button class="btn link" id="replay-tour"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>Take the tour</button>
      <p class="fine">Dates and counts are computed by code. Every line cites the sentence it came from. Reasons for absences are never shown.</p>
    </div>
  </aside>
  <main><div class="wrap" id="main"></div></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Receipts"></aside>
<div class="onb" id="onb" hidden></div>
<div class="tour" id="tour" hidden><div class="spot" id="spot"></div><div class="coach" id="coach" role="dialog" aria-live="polite"></div></div>

<script id="data" type="application/json">__RUNS_JSON__</script>
<script>
const RUNS = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const ICON = {
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  talk: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  file: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const parse = iso => { const [y, m, d] = iso.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const short = iso => { const d = parse(iso); return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const KIND = {brief: 'Brief', notes: 'Notes', tracker: 'Task list', availability: 'Schedule', other: 'Other'};

let state = {run: RUNS.length - 1, section: 'week', project: 'Team 4 sample project', from: null};
let slips = [];

/* ================= board ================= */
const SECTIONS = [
  {id: 'week', name: 'This week', count: b => b.top.length},
  {id: 'since', name: 'Since last run', count: b => b.since_last ? b.since_last.flagged.length : 0, hide: b => !b.since_last},
  {id: 'record', name: 'Project record', count: b => (b.items || []).length},
  {id: 'fair', name: 'Fair share', count: b => b.load.people.length},
  {id: 'coach', name: 'Check-in coach', count: b => (b.questions || []).length},
  {id: 'sources', name: 'Sources', count: b => b.counts.docs},
];
const TITLES = {
  week: ['This week, with receipts.', 'Three things to focus on. A starting point for your next team conversation.'],
  since: ['What we flagged, and what happened.', ''],
  record: ['One shared record.', 'Every task the files mention, with its owner, date and status.'],
  fair: ['Make the work visible.', 'Open commitments per person, straight from the files.'],
  coach: ['A better check-in.', 'A drafted agenda for your next team meeting.'],
  sources: ['The evidence behind it.', 'Every file read for this run, and how many claims came from each.'],
};
const ST = {done: ['Done', 'done'], in_progress: ['In progress', 'prog'], open: ['Open', ''], unknown: ['Unclear', 'unk']};
const ini = n => n.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const DAY = 864e5;

function rb(receipts, title, extra = '') {
  if (!receipts || !receipts.length) return '';
  slips.push({receipts, title});
  return `<button class="rbtn" ${extra} data-slip="${slips.length - 1}">${icon('file')}${receipts.length} receipt${receipts.length > 1 ? 's' : ''}</button>`;
}
const dots = level => { const n = {high: 3, med: 2, medium: 2, low: 1}[level] || 1; return `<span class="dots">${[1,2,3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`; };

function renderNav() {
  const b = RUNS[state.run];
  $('#nav').innerHTML = SECTIONS.filter(s => !(s.hide && s.hide(b))).map(s => `
    <button data-sec="${s.id}" ${s.id === state.section ? 'aria-current="page"' : ''}><span>${esc(s.name)}</span><span class="c">${s.count(b)}</span></button>`).join('');
}

function milestone(b) {
  const cd = b.countdown;
  if (!cd) return '';
  const now = parse(b.today), next = new Date(now.getTime() + cd.days * DAY);
  const prev = (b.items || []).filter(i => /\bm\d\b/i.test(i.title) && i.due && parse(i.due) < now).map(i => parse(i.due)).sort((x, y) => y - x)[0]
    || new Date(now.getTime() - 14 * DAY);
  const pct = Math.max(4, Math.min(100, Math.round(100 * (now - prev) / Math.max(DAY, next - prev))));
  return `<div class="mile" id="countdown"><span class="n">${cd.days}<small>days left</small></span>
    <div class="t">${esc(cd.label)}<span>${pct}% of the way from the last milestone</span></div>
    <div class="track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Time elapsed toward ${esc(cd.label)}"><div class="fill" style="width:${pct}%"></div></div></div>`;
}

function card(c, i) {
  return `<article class="card" data-card="${i}">
    <div class="top"><span class="rank">${String(c.rank).padStart(2, '0')}</span><span class="when">${icon('cal')}${esc(c.date_label)}</span></div>
    <h3>${esc(c.action)}</h3>
    <div class="chips"><span class="chip">${icon('user')}${esc(c.owner)}</span>${c.talk_first ? `<span class="chip talk">${icon('talk')}Talk as a team</span>` : ''}</div>
    <p class="reason">${esc(c.reason)}</p>
    ${c.note ? `<div class="note">${icon('clock')}<span>${esc(c.note)}</span></div>` : ''}
    <div class="foot"><span class="conf" title="${esc(c.confidence.why)}">${dots(c.confidence.level)}${esc(c.confidence.word)} confidence</span>${rb(c.receipts, c.action)}</div>
  </article>`;
}

const VIEWS = {
  week: b => milestone(b)
    + (b.top.length ? `<div class="cards">${b.top.map(card).join('')}</div>` : `<div class="empty">Nothing urgent found for this week.</div>`)
    + ((b.also || []).length ? `<div class="panel"><h3>Also this week</h3><div class="list">${b.also.map(c => `
      <div class="item"><div><div class="t">${esc(c.action)}</div><div class="m">${esc(c.owner)} · ${esc(c.date_label)} · ${esc(c.reason)}</div></div>${rb(c.receipts, c.action)}</div>`).join('')}</div></div>` : '')
    + `<div class="grid2">
    <div class="panel"><h3>Where the files disagree</h3><div class="list">${b.disagreements.length ? b.disagreements.map(x => `
      <div class="item"><div><div class="t">${esc(x.topic)}</div><div class="m">${x.sides.slice(0, 3).map(s => esc(s.says)).join(' vs ')}</div>
      <div class="m">We trust: <b>${esc(x.trust)}</b>${x.why ? ` · ${esc(x.why)}` : ''}</div></div>${rb(x.sides.flatMap(s => s.receipts), x.topic)}</div>`).join('') : '<p class="muted">The files agree on everything current.</p>'}</div></div>
    <div class="panel"><h3>Not on your task list yet</h3><div class="list">${b.missing.length ? b.missing.map(m => `<div class="item"><div><div class="t">${esc(m.item)}</div><div class="m">${esc(m.impact)}${m.due ? ` · due ${esc(m.due)}` : ''}</div></div>${rb(m.receipts, m.item)}</div>`).join('') : '<p class="muted">Nothing missing.</p>'}</div></div></div>`
    + ((b.answered || []).length ? `<div class="panel"><h3>Already answered by the brief</h3><div class="list">${b.answered.map(a => `<div class="item"><div><div class="m">“${esc(a.question)}”</div><div class="t" style="margin-top:4px">${esc(a.answer)}</div></div>${rb(a.receipts, a.question)}</div>`).join('')}</div></div>` : ''),
  since: b => `<p class="muted">What we flagged on ${esc(b.since_last.prev_label)}, and what the newest files say happened.</p>
    <div class="rows">${b.since_last.flagged.map(x => { const cls = x.now === 'Done' ? 'done' : x.now === 'In progress' ? 'prog' : '';
      return `<div class="row"><div><div class="t">${esc(x.was)}</div><div class="m">${esc(x.owner)} · flagged for ${esc(x.by)}</div></div>
        <span class="pill ${cls}">${esc(x.now)}</span>${rb(x.receipts, x.was) || '<span></span>'}</div>`; }).join('')}</div>`,
  record: b => {
    const q = (state.q || '').toLowerCase(), f = state.filter || 'all';
    const rows = (b.items || []).filter(i => (f === 'all' || (f === 'done') === (i.status === 'done'))
        && (!q || `${i.title} ${i.owner.join(' ')}`.toLowerCase().includes(q)))
      .sort((x, y) => (x.due || '9999').localeCompare(y.due || '9999'));
    return `<div class="toolrow"><input class="search" id="recq" type="search" placeholder="Search tasks or people" aria-label="Search tasks or people" value="${esc(state.q || '')}">
      <div class="seg" role="group" aria-label="Filter by status">${['all', 'open', 'done'].map(k => `<button data-filter="${k}" aria-pressed="${k === f}">${cap(k)}</button>`).join('')}</div></div>
      <div class="panel tablewrap"><table class="rec"><thead><tr><th>Task</th><th>Owner</th><th>Due</th><th>Status</th><th>Sources</th></tr></thead><tbody>
      ${rows.map(i => { const st = ST[i.status] || [i.status, 'unk']; return `<tr><td><b>${esc(cap(i.title))}</b></td>
        <td>${i.owner.length ? esc(i.owner.map(o => o.split(' ')[0]).join(', ')) : '<span class="muted">No owner</span>'}</td>
        <td class="mono">${i.due ? esc(short(i.due)) : '<span class="muted">No date</span>'}</td>
        <td><span class="pill ${st[1]}">${esc(st[0])}</span></td><td class="mono">${i.receipts}</td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">No tasks match.</td></tr>'}
      </tbody></table></div>`;
  },
  fair: b => {
    const done = {};
    (b.items || []).forEach(i => i.status === 'done' && i.owner.forEach(o => { const n = o.split(' ')[0]; done[n] = (done[n] || 0) + 1; }));
    return `<div class="caution">${esc(b.load.note)} People are listed alphabetically, never ranked.</div>
      <div class="people">${[...b.load.people].sort((x, y) => x.name.localeCompare(y.name)).map(p => `<div class="panel person">
        <div class="who"><span class="av" aria-hidden="true">${esc(ini(p.name))}</span><b>${esc(p.name)}</b></div>
        <div class="nums"><div><b>${p.open_items}</b><span>open commitments</span></div><div><b>${done[p.name] || 0}</b><span>documented as done</span></div></div></div>`).join('')}</div>
      ${(b.questions || []).length ? `<div class="panel"><h3>Questions for the team</h3><div class="list">${b.questions.map(q => `<div class="item"><div class="t">${esc(q.text)}</div></div>`).join('')}</div></div>` : ''}`;
  },
  coach: b => {
    const qs = [...(b.questions || []).map(q => q.text), ...b.disagreements.filter(d => d.trust === 'Ask the team').map(d => `${d.topic.split(':')[0]}: who owns it?`)];
    return `<div class="coachgrid"><div class="panel agenda" id="agenda">
      <div><h4>1 · Where we are</h4><p>${esc(b.today_label)}${b.countdown ? `: ${esc(b.countdown.label)}, ${b.countdown.days} days out.` : '.'}</p>
        ${b.since_last ? `<ul style="margin-top:8px">${b.since_last.flagged.map(x => `<li>${esc(x.was)}: ${esc(x.now.toLowerCase())}</li>`).join('')}</ul>` : ''}</div>
      <div><h4>2 · Three priorities</h4><ol>${b.top.map(c => `<li><b>${esc(c.action)}</b> · ${esc(c.owner)} · ${esc(c.date_label)}<br><span class="muted">${esc(c.reason)}</span></li>`).join('')}</ol></div>
      <div><h4>3 · Questions to talk through</h4>${qs.length ? `<ul>${qs.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : '<p class="muted">None this week.</p>'}</div></div>
      <div class="panel"><h3>A guide, not a verdict.</h3><p class="muted">Every point comes from your files and has a receipt on This week. Reorder it, edit it, or drop what doesn't fit your team.</p>
        <button class="btn primary" id="copy-agenda">${icon('file')}Copy agenda</button><button class="btn ghost" id="dl-agenda">Download .txt</button><span class="muted" id="copied" aria-live="polite"></span></div></div>`;
  },
  sources: b => `<div class="stats">${[[b.counts.docs, 'files read'], [b.counts.claims, 'quoted claims'], [(b.items || []).length, 'tasks tracked'], [b.counts.findings, 'findings checked in code']]
      .map(([n, t]) => `<div class="panel stat"><b>${n}</b><span>${t}</span></div>`).join('')}</div>
    <div class="panel"><h3>Files</h3><div class="list">${b.docs.map(f => `<div class="item srcfile"><div><div class="t">${esc(f.file.split('/').pop())}</div>
      <div class="m"><span class="kind ${esc(f.kind)}">${esc(KIND[f.kind] || f.kind)}</span>${f.doc_date ? esc(short(f.doc_date)) : 'undated'}${f.author ? ` · ${esc(f.author)}` : ''} · ${f.lines} lines</div></div>
      <span class="pill unk">${f.claims ?? 0} claims</span></div>`).join('')}</div></div>`,
};

function renderMain() {
  const b = RUNS[state.run];
  slips = [];
  const secs = SECTIONS.filter(s => !(s.hide && s.hide(b)));
  if (!secs.find(s => s.id === state.section)) state.section = 'week';
  const [h, sub] = TITLES[state.section];
  $('#main').innerHTML = `
    <div class="crumb"><span>${esc(state.project)} / <b>${esc(secs.find(s => s.id === state.section).name)}</b></span>
      <label class="datesel" id="rundate">${icon('cal')}<select id="runsel" aria-label="Run date">${RUNS.map((r, i) => `<option value="${i}" ${i === state.run ? 'selected' : ''}>${esc(short(r.today))}, ${r.today.slice(0, 4)}</option>`).join('')}</select></label></div>
    <div class="hero"><div class="eyebrow">${b.counts.docs} files · ${b.counts.claims} quoted claims</div><h1>${esc(h)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div>
    <section class="panelwrap" aria-label="${esc(h)}">${VIEWS[state.section](b)}</section>`;
}
function render() { renderNav(); renderMain(); }
function agendaText() { return $('#agenda').innerText.replace(/\n{3,}/g, '\n\n'); }
function copyAgenda() {
  const ta = document.createElement('textarea'); ta.value = agendaText(); document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (ok) { $('#copied').textContent = 'Copied.'; return; }
  const r = document.createRange(); r.selectNodeContents($('#agenda'));
  getSelection().removeAllRanges(); getSelection().addRange(r);
  $('#copied').textContent = 'Agenda selected. Press Ctrl+C to copy.';
}
function downloadAgenda() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([agendaText()], {type: 'text/plain'}));
  a.download = `check-in-${RUNS[state.run].today}.txt`; a.click(); URL.revokeObjectURL(a.href);
}

function openSlip(i) {
  const {receipts, title} = slips[i];
  $('#drawer').innerHTML = `<div class="slip" role="dialog" aria-modal="true" aria-label="Receipts">
    <div class="top"><b>RECEIPTS</b><button class="x" id="close" aria-label="Close">${icon('x')}</button></div>
    <hr><div class="title">${esc(title)}</div><hr>
    ${receipts.map(r => `<div class="src"><span class="lbl">${esc(r.label)}</span><span class="loc">${esc(r.file)} · ${esc(r.loc)}</span>
      ${r.private ? `<span class="priv">Quote withheld because it may include personal details. The card shows only the constraint.</span>` : `<q>${esc(r.quote)}</q>`}</div>`).join('')}
    <hr><div class="tot"><span>SOURCES</span><span>${receipts.length}</span></div>
    <p class="fine">Every quote was checked word for word against its file.<br>Dates on the board are computed by code.</p></div>`;
  $('#drawer').hidden = false; $('#scrim').hidden = false; $('#close').focus();
}
function closeSlip() { $('#drawer').hidden = true; $('#scrim').hidden = true; if (state.from) state.from.focus(); }

/* ================= setup wizard ================= */
const STEPS = ['Project', 'Week', 'Files', 'Ground rules'];
let ob = {step: 0, run: RUNS.length - 1, building: false};

function stepper() {
  return `<div class="stepper">${STEPS.map((s, i) => `${i ? '<div class="line"></div>' : ''}
    <div class="st ${i < ob.step ? 'done' : i === ob.step ? 'active' : ''}"><span class="o">${i < ob.step ? icon('check') : i + 1}</span><span>${s}</span></div>`).join('')}</div>`;
}
function obBody() {
  const b = RUNS[ob.run];
  if (ob.building) return `<div><h2>Building your board</h2><p class="lead">Four steps, each one checked before the next runs.</p></div>
    <div class="build">${[
      ['Reading your files', `${b.counts.docs} files: notes, task lists, schedules and the brief`],
      ['Pulling out what each file says', `${b.counts.claims} claims, every quote checked word for word`],
      ['Checking dates and deadlines in code', `${b.counts.findings} findings, nothing guessed by AI`],
      ['Ranking what matters this week', `${b.top.length} things to act on${b.countdown ? `, ${b.countdown.days} days before ${b.countdown.label.split(' due')[0]}` : ''}`],
    ].map(([t, m], i) => `<div class="stage" id="stage${i}"><span class="ic"></span><div><b>${t}</b><span>${m}</span></div></div>`).join('')}</div>
    <div class="actions"><span></span><div class="right"><button class="btn primary" id="ob-done" disabled>Show my week ${icon('arrow')}</button></div></div>`;
  const back = ob.step ? `<button class="btn ghost" id="ob-back">Back</button>` : '';
  const next = (label) => `<div class="actions">${back}<div class="right"><button class="btn primary" id="ob-next">${label} ${icon('arrow')}</button></div></div>`;
  if (ob.step === 0) return `<div><h2>Name your project</h2><p class="lead">Receipts reads the files your team already keeps and tells you what needs attention this week.</p></div>
    <div class="field"><label for="ob-name">Project name</label><input id="ob-name" value="${esc(state.project)}" autocomplete="off"><span class="hint">Only you see this. It labels your runs.</span></div>${next('Continue')}`;
  if (ob.step === 1) return `<div><h2>Pick the week</h2><p class="lead">Each run is a snapshot of your files on one day. Countdowns are measured from that date.</p></div>
    <div class="choices" role="radiogroup">${RUNS.map((r, i) => { const d = parse(r.today); return `
      <button class="choice" role="radio" data-pick="${i}" aria-checked="${i === ob.run}"><span class="cal"><i>${MON[d.getMonth()]}</i><b>${d.getDate()}</b></span>
      <span><span class="t">${esc(r.today_label)}</span><br><span class="m">${r.counts.docs} files${r.countdown ? ` · ${esc(r.countdown.label)}` : ''}</span></span></button>`; }).join('')}</div>${next('Continue')}`;
  if (ob.step === 2) return `<div><h2>Add your project files</h2><p class="lead">Meeting notes, the task list, the schedule sheet and the course brief. Word, Excel, PDF and text all work.</p></div>
    <label class="drop" id="drop">${icon('upload')}<span><b>Drop a project folder here</b> or click to choose files<br><span class="hint" id="drop-hint">${ob.picked ? esc(ob.picked) : 'This demo uses the Team 4 sample kit.'}</span></span>
      <input type="file" id="drop-in" multiple hidden></label>
    <div class="files">${b.docs.map(f => `<div class="file"><span class="kind ${esc(f.kind)}">${esc(KIND[f.kind] || f.kind)}</span>
      <span class="nm" title="${esc(f.file)}">${esc(f.file.split('/').pop())}</span>
      <span class="mt">${f.doc_date ? esc(short(f.doc_date)) : 'undated'}${f.author ? ` · ${esc(f.author)}` : ''}</span></div>`).join('')}</div>${next('Continue')}`;
  return `<div><h2>Ground rules</h2><p class="lead">Receipts supports the team. It doesn't judge it.</p></div>
    <div class="rules">${[
      ['Your files stay on hardware you control', 'Nothing goes to a cloud AI service.'],
      ['Constraints, never reasons', 'It says "away Oct 28 to Nov 1", never why.'],
      ['It never ranks people', 'Workload questions go to the team as a conversation, and peer evaluations are off limits.'],
      ['Every line has a receipt', 'Dates come from code. If it can\'t point to a sentence, it doesn\'t say it.'],
    ].map(([t, m]) => `<div class="rule"><span class="ck">${icon('check')}</span><div><b>${t}</b><span>${m}</span></div></div>`).join('')}</div>${next('Build my board')}`;
}
function renderOb() {
  $('#onb').innerHTML = `<div class="ob" role="dialog" aria-modal="true" aria-label="Set up Receipts">
    <div class="bar1"><div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg></span><div><b>Receipts</b><span>Setup</span></div></div>
      <button class="btn link" id="ob-skip">Skip to board</button></div>
    ${stepper()}${obBody()}</div>`;
  const first = $('#onb input, #onb [aria-checked="true"], #ob-next'); if (first) first.focus();
}
function openOb() { ob = {step: 0, run: state.run, building: false}; $('#onb').hidden = false; renderOb(); }
function closeOb(startTour) { $('#onb').hidden = true; state.run = ob.run; state.section = 'week'; render(); if (startTour) setTimeout(() => startTourAt(0), 250); }
function build() {
  ob.building = true; ob.step = STEPS.length; renderOb();
  [0, 1, 2, 3].forEach(i => {
    setTimeout(() => $(`#stage${i}`)?.classList.add('running'), i * 700);
    setTimeout(() => { const s = $(`#stage${i}`); if (s) { s.classList.remove('running'); s.classList.add('ok'); s.querySelector('.ic').innerHTML = icon('check'); } }, i * 700 + 650);
  });
  setTimeout(() => { const d = $('#ob-done'); if (d) { d.disabled = false; d.focus(); } }, 4 * 700);
}

/* ================= guided tour ================= */
const TOUR = [
  {sel: '.card[data-card="0"]', k: 'This week', title: 'Three things, ten seconds', body: 'Each card names a task, a person, a date and the reason. The most urgent deadline comes first.', why: 'Why: busy teammates read the first screen and nothing else.'},
  {sel: '.card[data-card="0"] .rbtn', k: 'Receipts', title: 'Every line has a receipt', body: 'Open it to see the exact sentences the card came from, with the file and line.', why: 'If we can\'t point to a source, it doesn\'t go on the board.'},
  {sel: '.card[data-card="0"] .conf', k: 'Confidence', title: 'It says how sure it is', body: 'High means the brief or two files agree. Lower means one source, or files that conflict.', why: 'Hover for the one-line reason.'},
  {sel: '.chip.talk', k: 'People first', title: 'Some things are a conversation', body: 'When a card is about someone\'s workload or a role gap, it asks the team to talk instead of handing down a verdict.', why: 'It never ranks people or touches peer evaluations.'},
  {sel: '#countdown', k: 'Milestone', title: 'Days to the next deadline', body: 'Computed in code from the brief, never guessed by AI.', why: 'A demo that gets a date wrong is over.'},
  {sel: '#rundate', k: 'Next week', title: 'Run it again next week', body: 'Each run is a snapshot. Switch dates here. The newest run shows what happened to last week\'s warnings under "Since last run".', why: 'That closes the loop: flagged, then done or still open.', last: true},
];
let tourAt = 0;
function startTourAt(i) {
  const steps = TOUR.filter(t => document.querySelector(t.sel));
  if (!steps.length) return;
  tourAt = Math.max(0, Math.min(i, steps.length - 1));
  const t = steps[tourAt], el = document.querySelector(t.sel);
  el.scrollIntoView({block: 'center', behavior: 'instant'});
  const r = el.getBoundingClientRect(), pad = 8;
  Object.assign($('#spot').style, {top: `${r.top - pad}px`, left: `${r.left - pad}px`, width: `${r.width + pad * 2}px`, height: `${r.height + pad * 2}px`});
  $('#coach').innerHTML = `<span class="k">${tourAt + 1} of ${steps.length} · ${esc(t.k)}</span><h4>${esc(t.title)}</h4><p>${esc(t.body)}</p><p class="why">${esc(t.why)}</p>
    <div class="actions"><button class="btn link" id="t-skip">Skip tour</button><div class="right">${tourAt ? '<button class="btn ghost" id="t-back">Back</button>' : ''}
    <button class="btn primary" id="t-next">${tourAt === steps.length - 1 ? 'Done' : 'Next'}</button></div></div>`;
  $('#tour').hidden = false;
  const c = $('#coach'), cw = c.offsetWidth, ch = c.offsetHeight, vw = innerWidth, vh = innerHeight;
  let top = r.bottom + 16, left = Math.min(Math.max(16, r.left), vw - cw - 16);
  if (top + ch > vh - 16) top = r.top - ch - 16;
  if (top < 16) { top = Math.min(vh - ch - 16, r.top); left = r.right + 16 + cw < vw ? r.right + 16 : Math.max(16, r.left - cw - 16); }
  Object.assign(c.style, {top: `${top}px`, left: `${left}px`});
  $('#t-next').focus();
  startTourAt.count = steps.length;
}
function endTour(goNext) {
  $('#tour').hidden = true;
  if (goNext && RUNS.length > 1) { state.run = RUNS.length - 1; state.section = RUNS[state.run].since_last ? 'since' : 'week'; render(); }
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target;
  const run = t.closest('[data-run]'), sec = t.closest('[data-sec]'), slip = t.closest('[data-slip]'), pick = t.closest('[data-pick]');
  if (t.closest('#ob-next')) {
    if (ob.step === 0) state.project = ($('#ob-name').value || '').trim() || state.project;
    if (ob.step === STEPS.length - 1) return build();
    ob.step++; return renderOb();
  }
  if (t.closest('#ob-back')) { ob.step--; return renderOb(); }
  if (t.closest('#ob-skip')) return closeOb(false);
  if (t.closest('#ob-done')) return closeOb(true);
  if (pick) { ob.run = +pick.dataset.pick; return renderOb(); }
  if (t.closest('#t-next')) return tourAt === startTourAt.count - 1 ? endTour(true) : startTourAt(tourAt + 1);
  if (t.closest('#t-back')) return startTourAt(tourAt - 1);
  if (t.closest('#t-skip')) return endTour(false);
  if (t.closest('#replay-setup')) return openOb();
  if (t.closest('#replay-tour')) { state.section = 'week'; render(); return startTourAt(0); }
  if (run) { state.run = +run.dataset.run; render(); }
  else if (sec) { state.section = sec.dataset.sec; render(); }
  else if (t.closest('[data-filter]')) { state.filter = t.closest('[data-filter]').dataset.filter; renderMain(); }
  else if (t.closest('#copy-agenda')) copyAgenda();
  else if (t.closest('#dl-agenda')) downloadAgenda();
  else if (slip) { state.from = slip; openSlip(+slip.dataset.slip); }
  else if (t.closest('#close') || t.id === 'scrim') closeSlip();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#drawer').hidden) closeSlip(); else if (!$('#tour').hidden) endTour(false); }
  if (e.key === 'Enter' && e.target.id === 'ob-name') $('#ob-next').click();
});
function pickFiles(files) {
  const n = files.length;
  ob.picked = n ? `${n} file${n > 1 ? 's' : ''} selected. This browser demo still builds from the Team 4 sample kit; run receipts.py on your folder to build yours.` : '';
  renderOb();
}
document.addEventListener('change', e => {
  if (e.target.id === 'runsel') { state.run = +e.target.value; render(); }
  if (e.target.id === 'drop-in') pickFiles(e.target.files);
});
document.addEventListener('dragover', e => { if (e.target.closest && e.target.closest('#drop')) e.preventDefault(); });
document.addEventListener('drop', e => { if (e.target.closest && e.target.closest('#drop')) { e.preventDefault(); pickFiles(e.dataTransfer.files); } });
document.addEventListener('input', e => {
  if (e.target.id !== 'recq') return;
  state.q = e.target.value; renderMain();
  const i = $('#recq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length);
});
addEventListener('resize', () => { if (!$('#tour').hidden) startTourAt(tourAt); });

render();
if (!location.hash.includes('board')) openOb();
</script>
</body>
</html>
